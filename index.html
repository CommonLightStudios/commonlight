<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Light</title>
<meta name="description" content="Common Light: apps for photographers.">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --link:#0066cc; --rule:#d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#f2f2f2; --muted:#9a9aa0; --link:#5ea8ff; --rule:#3a3a3c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width:42rem; margin:0 auto; padding:2.5rem 1rem 4rem; }
  h1 { font-size:1.9rem; line-height:1.2; margin:0 0 .25rem; }
  h2 { font-size:1.2rem; margin:2rem 0 .4rem; }
  .meta { color:var(--muted); margin:0 0 1.5rem; }
  a { color:var(--link); }
  ul { padding-left:1.2rem; }
  footer { margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule); color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
<h1>Common Light</h1>
<p class="meta">Apps for photographers.</p>
<h2>SNAP RAW</h2>
<p>An iPhone RAW camera: native Bayer DNG capture, and an optional 8-frame burst combined into a 24MP Bayer DNG.</p>
<ul>
<li><a href="/snapraw/support/">Support</a></li>
<li><a href="/snapraw/privacy/">Privacy policy</a></li>
</ul>
<footer>&copy; 2026 Common Light &middot; <a href="/">commonlight.app</a></footer>
</main>
</body>
</html>
